        stroke: #000;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 14 12;
      }
      .tree {
        fill: none;
        stroke: #228B22;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tree line {
        stroke: #8B4513;
