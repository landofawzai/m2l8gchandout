<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <!-- White background for SVG viewing -->
  <rect width="800" height="1200" fill="white"/>
  <defs>
    <style>
      .line {
        fill: none;
        stroke: #000;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin {
        fill: none;
        stroke: #000;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dash {
        fill: none;
        stroke: #000;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 14 12;
      }
      .tree {
        fill: none;
        stroke: #000;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>


  <!-- Title above rays -->
  <text x="400" y="55" text-anchor="middle" font-family="serif" font-size="28" fill="#000">The Presence of God</text>

  <!-- Rays -->
  <g class="thin">
    <line x1="400" y1="113" x2="400" y2="75"/>
    <line x1="434" y1="124" x2="462" y2="98"/>
    <line x1="448" y1="155" x2="492" y2="155"/>
    <line x1="436" y1="184" x2="465" y2="210"/>
    <line x1="366" y1="124" x2="338" y2="98"/>
    <line x1="352" y1="155" x2="308" y2="155"/>
    <line x1="364" y1="184" x2="335" y2="210"/>

    <line x1="400" y1="110" x2="400" y2="92"/>
    <line x1="423" y1="116" x2="439" y2="100"/>
    <line x1="434" y1="155" x2="454" y2="155"/>
    <line x1="423" y1="194" x2="439" y2="210"/>
    <line x1="377" y1="116" x2="361" y2="100"/>
    <line x1="366" y1="155" x2="346" y2="155"/>
    <line x1="377" y1="194" x2="361" y2="210"/>
  </g>

  <!-- Head -->
  <circle class="line" cx="400" cy="145" r="22"/>

  <!-- Stick cross / Jesus-source -->
  <g class="line">
    <line x1="400" y1="167" x2="400" y2="335"/>
    <line x1="340" y1="178" x2="460" y2="178"/>
  </g>

  <!-- River banks -->
  <path class="line" d="
    M 394 330
    C 382 375, 338 415, 322 465
    C 300 530, 378 585, 418 640
    C 450 690, 332 770, 262 850
    C 210 910, 235 1000, 285 1120" />

  <path class="line" d="
    M 406 330
    C 396 375, 368 415, 358 465
    C 342 530, 425 585, 468 640
    C 505 690, 428 770, 398 850
    C 375 910, 528 1000, 650 1120" />


  <!-- Dashed return path -->
  <path class="dash" marker-end="url(#arrow)" d="
    M 260 1125
    C 175 1108, 115 1045, 110 980
    C 105 885, 130 815, 180 760" />

  <!-- Trees left -->
  <g class="tree">
    <line x1="275" y1="665" x2="275" y2="735"/>
    <circle cx="275" cy="640" r="28"/>
    <line x1="275" y1="655" x2="275" y2="680"/>
    <line x1="275" y1="667" x2="262" y2="653"/>
    <line x1="275" y1="667" x2="288" y2="653"/>

    <line x1="320" y1="625" x2="320" y2="695"/>
    <circle cx="320" cy="600" r="28"/>
    <line x1="320" y1="615" x2="320" y2="640"/>
    <line x1="320" y1="627" x2="307" y2="613"/>
    <line x1="320" y1="627" x2="333" y2="613"/>

    <line x1="295" y1="705" x2="295" y2="775"/>
    <circle cx="295" cy="680" r="28"/>
    <line x1="295" y1="695" x2="295" y2="720"/>
    <line x1="295" y1="707" x2="282" y2="693"/>
    <line x1="295" y1="707" x2="308" y2="693"/>
  </g>

