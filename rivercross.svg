    <circle cx="200" cy="995" r="28"/>
    <line x1="200" y1="1010" x2="200" y2="1035"/>
    <line x1="200" y1="1022" x2="187" y2="1008"/>
    <line x1="200" y1="1022" x2="213" y2="1008"/>

    <line x1="245" y1="1045" x2="245" y2="1115"/>
    <circle cx="245" cy="1020" r="28"/>
    <line x1="245" y1="1035" x2="245" y2="1060"/>
    <line x1="245" y1="1047" x2="232" y2="1033"/>
    <line x1="245" y1="1047" x2="258" y2="1033"/>
  </g>

  <!-- Trees right -->
  <g class="tree">
    <line x1="590" y1="1010" x2="590" y2="1080"/>
    <circle cx="590" cy="985" r="28"/>
    <line x1="590" y1="1000" x2="590" y2="1025"/>
    <line x1="590" y1="1012" x2="577" y2="998"/>
    <line x1="590" y1="1012" x2="603" y2="998"/>

    <line x1="635" y1="980" x2="635" y2="1050"/>
    <circle cx="635" cy="955" r="28"/>
    <line x1="635" y1="970" x2="635" y2="995"/>
    <line x1="635" y1="982" x2="622" y2="968"/>
    <line x1="635" y1="982" x2="648" y2="968"/>

    <line x1="675" y1="1000" x2="675" y2="1070"/>
    <circle cx="675" cy="975" r="28"/>
    <line x1="675" y1="990" x2="675" y2="1015"/>
    <line x1="675" y1="1002" x2="662" y2="988"/>
    <line x1="675" y1="1002" x2="688" y2="988"/>

    <line x1="620" y1="1050" x2="620" y2="1120"/>
    <circle cx="620" cy="1025" r="28"/>
    <line x1="620" y1="1040" x2="620" y2="1065"/>
    <line x1="620" y1="1052" x2="607" y2="1038"/>
    <line x1="620" y1="1052" x2="633" y2="1038"/>

    <line x1="705" y1="1035" x2="705" y2="1105"/>
    <circle cx="705" cy="1010" r="28"/>
    <line x1="705" y1="1025" x2="705" y2="1050"/>
    <line x1="705" y1="1037" x2="692" y2="1023"/>
