<svg xmlns="http://www.w3.org/2000/svg" viewBox="2100 -2255 6370 3051" role="img" aria-labelledby="sh-title sh-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="sh-title">Sun and heart</title>
  <desc id="sh-desc">A heart held within a bowl-shaped sun with four rays, its top level with the sun's rim.</desc>

  <!-- Resizable: no width/height, so it fills whatever box you put it in.
       Recolor by inlining this markup in the page and setting CSS `color:` -
       every stroke is currentColor. Loaded via <img>/<object> it stays black,
       since those are separate documents and don't inherit the page's color.
       Stroke, width and caps are ALSO set as attributes on every path so apps
       that ignore the <style> block (PowerPoint, Word, Canva, some previewers)
       still draw the lines at the right weight. -->
  <style>
    .sh { fill: none; stroke: currentColor; stroke-width: 187;
          stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <g id="sun">
    <path fill="none" stroke="#000" stroke-width="187" stroke-linecap="round" stroke-linejoin="round" class="sh" d="M 3322.58,-2162.00 A 1962.28,1962.28 0 0,0 7247.14,-2162.00"/>
    <g>
      <path fill="none" stroke="#000" stroke-width="187" stroke-linecap="round" stroke-linejoin="round" class="sh" d="M 3352.39,-1821.26 L 2192.91,-1616.81"/>
      <path fill="none" stroke="#000" stroke-width="187" stroke-linecap="round" stroke-linejoin="round" class="sh" d="M 4023.53,-658.81 L 2881.06,702.72"/>
      <path fill="none" stroke="#000" stroke-width="187" stroke-linecap="round" stroke-linejoin="round" class="sh" d="M 6546.18,-658.81 L 7688.65,702.72"/>
      <path fill="none" stroke="#000" stroke-width="187" stroke-linecap="round" stroke-linejoin="round" class="sh" d="M 7217.32,-1821.26 L 8376.80,-1616.81"/>
    </g>
  </g>

  <!-- Heart at 3.2114x the diagram's original, anchored by its top edge (not
       its centre) so it stays level with the sun's rim as it grows. Same
       stroke as the sun, inherited from .sh. Coordinates are baked. -->
  <path fill="none" stroke="#000" stroke-width="187" stroke-linecap="round" stroke-linejoin="round" id="heart" class="sh" d="M5282.00,-1773.91 C4931.96,-2491.66 4371.89,-2071.60 4371.89,-1651.55 C4371.89,-1336.51 4721.93,-1091.49 5282.00,-741.44 C5842.07,-1091.49 6192.11,-1336.51 6192.11,-1651.55 C6192.11,-2071.60 5632.04,-2491.66 5282.00,-1773.91 Z"/>
</svg>
