  <title id="hh-title">Heart in hand</title>
  <desc id="hh-desc">Outline of an open hand, fingers up, with a heart in the palm.</desc>
  <!-- Hand: the simplified Illustrator outline (a filled shape, line ~6 units).
       The thumb crease inside the palm was removed and replaced with a short
       U-shaped web between index finger and thumb, so the palm is clear.
       Heart: the O of GOD, scaled to 60 units wide and stroked at 6 units to
       match the outline weight, centred in the palm, 8 units higher than the geometric centre so it sits under the fingers rather than at the wrist.
       Both use currentColor; inline the SVG to recolour with CSS color. -->
